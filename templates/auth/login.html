<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Nexflis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <style>
      body { background: #0d0d0d; min-height: 100vh; display: flex; flex-direction: column; }
      .auth-card {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        padding: 2.5rem;
        width: 100%;
        max-width: 420px;
      }
      .auth-card input.form-control {
        background: #111;
        border: 1px solid #333;
        color: #fff;
        border-radius: 8px;
      }
      .auth-card input.form-control:focus {
        background: #111;
        border-color: #e50914;
        color: #fff;
        box-shadow: 0 0 0 2px rgba(229,9,20,.25);
      }
      .btn-nexflis {
        background: #e50914;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        width: 100%;
        padding: .65rem;
      }
      .btn-nexflis:hover { background: #b0070f; color: #fff; }
      .brand-link { color: #e50914; text-decoration: none; font-weight: 700; font-size: 1.5rem; }
    </style>
  </head>
  <body>
    <nav class="navbar-custom sticky-top d-flex align-items-center px-4">
      <a href="/" class="brand-link">NEXFLIS</a>
    </nav>

    <div class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
      <div class="auth-card">
        <h4 class="text-white mb-1 fw-bold">Iniciar sesion</h4>
        <p class="text-secondary mb-4" style="font-size:.9rem;">Accede a tus recomendaciones personalizadas.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, msg in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} py-2 mb-3" role="alert">
              {{ msg }}
            </div>
          {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login_post') }}" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          <div class="mb-3">
            <label for="username" class="form-label text-secondary" style="font-size:.85rem;">Usuario</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="tu_usuario" required autocomplete="username" />
          </div>
          <div class="mb-4">
            <label for="password" class="form-label text-secondary" style="font-size:.85rem;">Contrasena</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-nexflis">Entrar</button>
        </form>

        <p class="text-center text-secondary mt-4 mb-0" style="font-size:.88rem;">
          No tienes cuenta?
          <a href="{{ url_for('auth.register_form') }}" class="text-danger">Registrate</a>
        </p>
      </div>
    </div>
  </body>
</html>
